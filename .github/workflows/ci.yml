name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Der Workflow baut und testet nur – er braucht keinerlei Schreibrechte.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen
        run: npm run build

      - name: js/ und sw.js sind mit src/ synchron
        run: |
          if ! git diff --exit-code -- js/ sw.js; then
            echo "::error::Das committete js/ oder sw.js weicht vom Quellcode ab. Bitte 'npm run build' ausführen und das Ergebnis mitcommitten."
            exit 1
          fi

      - name: Precache-Liste des Service Workers ist aktuell
        run: npm run sw:check

      - name: Tests
        run: node --test test/*.test.js
