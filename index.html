<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>Zahleneule – Rechnen üben in der 2. Klasse</title>
    <meta
      name="description"
      content="Kostenlose Lernplattform für Mathematik in der 2. Klasse: Zahlenraum bis 100, Einmaleins, Geld, Uhrzeit, Längen, Formen und Sachaufgaben."
    />
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140e26" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

    <!--
      iOS wertet das Manifest für den Startbildschirm nicht aus: Ohne
      apple-touch-icon nimmt Safari einen Bildschirmausschnitt als Symbol, und
      ohne die apple-Metaangaben startet die Seite mit Adresszeile statt als App.
    -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zahleneule" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <a class="sprungmarke" href="#inhalt">Zum Inhalt springen</a>
    <div id="app"></div>
    <noscript>
      <p class="noscript-hinweis">Für die Zahleneule muss JavaScript eingeschaltet sein.</p>
    </noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
